name: Axiom CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew spotlessCheck
      - run: ./gradlew test
      - run: ./gradlew build
