services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${AXIOM_POSTGRES_DB:-axiom}
      POSTGRES_USER: ${AXIOM_DB_USERNAME:-axiom}
      POSTGRES_PASSWORD: ${AXIOM_DB_PASSWORD:-axiom}
    ports:
      - "${AXIOM_DB_PORT:-5432}:5432"
    volumes:
      - axiom-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  axiom:
    profiles: ["application"]
    build:
      context: .
    image: axiom:local
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      AXIOM_API_SECURITY_ENABLED: ${AXIOM_API_SECURITY_ENABLED:-false}
      AXIOM_API_KEY: ${AXIOM_API_KEY:-}
      AXIOM_HISTORY_MAX_DAYS: ${AXIOM_HISTORY_MAX_DAYS:-730}
      AXIOM_HISTORY_MAX_RUNS: ${AXIOM_HISTORY_MAX_RUNS:-1000}
      AXIOM_HISTORY_MAX_RESULTS: ${AXIOM_HISTORY_MAX_RESULTS:-100}
      AXIOM_HISTORY_ACTIVE_RECENT_RUNS: ${AXIOM_HISTORY_ACTIVE_RECENT_RUNS:-5}
      AXIOM_HISTORY_RESOLVED_CLEAN_RUNS: ${AXIOM_HISTORY_RESOLVED_CLEAN_RUNS:-3}
      AXIOM_HISTORY_MINIMUM_RECURRING_RUNS: ${AXIOM_HISTORY_MINIMUM_RECURRING_RUNS:-2}
      AXIOM_WEBHOOK_RECOVERY_BATCH_SIZE: ${AXIOM_WEBHOOK_RECOVERY_BATCH_SIZE:-10}
      AXIOM_WEBHOOK_PROCESSING_MAX_ATTEMPTS: ${AXIOM_WEBHOOK_PROCESSING_MAX_ATTEMPTS:-5}
      AXIOM_WEBHOOK_PROCESSING_BACKOFF_SECONDS: ${AXIOM_WEBHOOK_PROCESSING_BACKOFF_SECONDS:-30}
      AXIOM_WEBHOOK_STALE_SECONDS: ${AXIOM_WEBHOOK_STALE_SECONDS:-600}
      AXIOM_WEBHOOK_RECOVERY_POLL_MILLISECONDS: ${AXIOM_WEBHOOK_RECOVERY_POLL_MILLISECONDS:-10000}
      AXIOM_DB_URL: jdbc:postgresql://postgres:5432/${AXIOM_POSTGRES_DB:-axiom}
      AXIOM_DB_USERNAME: ${AXIOM_DB_USERNAME:-axiom}
      AXIOM_DB_PASSWORD: ${AXIOM_DB_PASSWORD:-axiom}
      AXIOM_GITHUB_TOKEN: ${AXIOM_GITHUB_TOKEN:-}
      AXIOM_GITHUB_BASE_URL: ${AXIOM_GITHUB_BASE_URL:-https://api.github.com}
      AXIOM_GITHUB_CONNECT_TIMEOUT: ${AXIOM_GITHUB_CONNECT_TIMEOUT:-5s}
      AXIOM_GITHUB_READ_TIMEOUT: ${AXIOM_GITHUB_READ_TIMEOUT:-30s}
      AXIOM_GITHUB_REQUEST_TIMEOUT: ${AXIOM_GITHUB_REQUEST_TIMEOUT:-35s}
      AXIOM_GITHUB_RETRY_MAX_ATTEMPTS: ${AXIOM_GITHUB_RETRY_MAX_ATTEMPTS:-3}
      AXIOM_GITHUB_RETRY_INITIAL_BACKOFF: ${AXIOM_GITHUB_RETRY_INITIAL_BACKOFF:-200ms}
      AXIOM_GITHUB_RETRY_MAX_BACKOFF: ${AXIOM_GITHUB_RETRY_MAX_BACKOFF:-2s}
      AXIOM_GITHUB_RESPONSE_BYTES: ${AXIOM_GITHUB_RESPONSE_BYTES:-25165824}
      AXIOM_STORED_LOG_BYTES: ${AXIOM_STORED_LOG_BYTES:-25165824}
      AXIOM_PUBLISHED_MARKDOWN_CHARACTERS: ${AXIOM_PUBLISHED_MARKDOWN_CHARACTERS:-60000}
      AXIOM_RERUN_HISTORY_MAX_EXECUTIONS: ${AXIOM_RERUN_HISTORY_MAX_EXECUTIONS:-1000}
      AXIOM_CHANGE_HISTORY_LOOKBACK: ${AXIOM_CHANGE_HISTORY_LOOKBACK:-50}
      AXIOM_WEBHOOK_MAX_PAYLOAD_BYTES: ${AXIOM_WEBHOOK_MAX_PAYLOAD_BYTES:-1048576}
      AXIOM_WEBHOOK_CORE_THREADS: ${AXIOM_WEBHOOK_CORE_THREADS:-2}
      AXIOM_WEBHOOK_MAX_THREADS: ${AXIOM_WEBHOOK_MAX_THREADS:-4}
      AXIOM_WEBHOOK_QUEUE_CAPACITY: ${AXIOM_WEBHOOK_QUEUE_CAPACITY:-100}
      AXIOM_GITHUB_WEBHOOK_SECRET: ${AXIOM_GITHUB_WEBHOOK_SECRET:-}
      AXIOM_GITHUB_WEBHOOK_ENABLED: ${AXIOM_GITHUB_WEBHOOK_ENABLED:-false}
      AXIOM_GITHUB_AUTO_PUBLISH_CHECK: ${AXIOM_GITHUB_AUTO_PUBLISH_CHECK:-false}
      AXIOM_GITHUB_AUTO_PUBLISH_PR_COMMENT: ${AXIOM_GITHUB_AUTO_PUBLISH_PR_COMMENT:-false}
    ports:
      - "${AXIOM_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  axiom-postgres-data:
